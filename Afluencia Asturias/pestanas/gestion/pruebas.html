<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Pruebas de Funciones avanzadas</title>
<style>body{font:14px/1.5 system-ui,sans-serif;margin:1rem}.ok{color:#1a7f37}.fallo{color:#b3261e;font-weight:700}</style>
</head><body>
<h1>Pruebas de la lógica de Funciones avanzadas</h1>
<p>Se ejecutan al abrir la página (doble clic). Usan las salidas reales del modelo en <code>datos/modelo/salidas.js</code>.</p>
<ul id="res"></ul>
<script src="../../datos/modelo/salidas.js"></script>
<script src="../../datos/datos.js"></script>
<script src="config-gestion.js"></script>
<script src="logica.js"></script>
<script>
(function () {
  const L = window.GestionLogica, D = window.DatosModelo.expandir(window.SALIDAS_MODELO), C = window.GestionConfig;
  const res = document.getElementById('res');
  let fallos = 0, total = 0;
  function prueba(nombre, fn) {
    total++;
    const li = document.createElement('li');
    try { fn(); li.className = 'ok'; li.textContent = 'OK  ' + nombre; }
    catch (e) { fallos++; li.className = 'fallo'; li.textContent = 'FALLO  ' + nombre + ' → ' + e.message; }
    res.appendChild(li);
  }
  const igual = (a, b, m) => { if (a !== b) throw new Error((m || '') + ' esperado ' + b + ', obtenido ' + a); };
  const cierto = (c, m) => { if (!c) throw new Error(m || 'no se cumple'); };

  const principal = L.zonas(D)[0];

  prueba('la zona principal va primero', () => cierto(principal.es_principal));

  prueba('alertas: ventana de 28 días desde fecha_hoy, 5 zonas por día, ordenadas', () => {
    const f = L.alertasProximas(D);
    igual(f.length, 28 * D.predicciones.zonas.length);
    igual(f[0].fecha, D.predicciones.fecha_hoy);
    igual(f[f.length - 1].fecha, L.sumarDias(D.predicciones.fecha_hoy, 27));
    for (let i = 1; i < f.length; i++) cierto(f[i - 1].fecha <= f[i].fecha, 'orden');
  });

  prueba('alertas: la acción sale de la configuración por color', () => {
    L.alertasProximas(D).forEach(a => igual(a.accion.texto, C.acciones[a.color].texto, a.fecha + ' ' + a.color));
  });

  prueba('alertas: la configuración propia sustituye a la de fábrica', () => {
    const cfg = { acciones: { verde: { texto: 'V' }, ambar: { texto: 'A' }, rojo: { texto: 'R' }, gris: { texto: 'G' } }, diasAlertas: 3 };
    const f = L.alertasProximas(D, { config: cfg });
    igual(f.length, 3 * D.predicciones.zonas.length);
    igual(f[0].accion.texto, { verde: 'V', ambar: 'A', rojo: 'R', gris: 'G' }[f[0].color]);
  });

  prueba('alertas: a 1-7 días usa futuro_corto cuando existe', () => {
    const f = L.alertasProximas(D, { dias: 7 });
    const hayCorto = D.predicciones.predicciones.some(p => p.conjunto === 'futuro_corto' && p.fecha >= D.predicciones.fecha_hoy);
    if (hayCorto) cierto(f.some(a => a.modelo === 'corto'), 'ninguna fila de corto plazo');
  });

  prueba('alertas: los colores son válidos y rojo/ámbar llevan cociente por encima del umbral de la cabecera', () => {
    L.alertasProximas(D, { dias: 60 }).forEach(a => {
      cierto(['verde', 'ambar', 'rojo', 'gris'].includes(a.color), a.color);
      if (a.color === 'rojo') cierto(a.cociente >= D.predicciones.umbrales.rojo - 1e-6, 'rojo ' + a.cociente);
    });
  });

  prueba('alertas: el acceso regulado a los Lagos solo se marca en su zona', () => {
    const zl = D.regulacion.lagos.zona_mitma_id;
    const f = L.alertasProximas(D, { dias: 366 });
    f.forEach(a => { if (a.zona_mitma_id !== zl) igual(a.lagos_regulado, null, a.fecha + ' ' + a.zona_mitma_id); });
    cierto(f.some(a => a.zona_mitma_id === zl && a.lagos_regulado === true), 'ningún día regulado en la zona de los Lagos');
  });

  prueba('fiabilidad: filas ordenadas 1..7, 8+ y grupos con n sumado', () => {
    const f = L.fiabilidad(D, principal.zona_mitma_id);
    igual(f.filas.map(x => x.horizonte_txt).join(','), '1,2,3,4,5,6,7,8+');
    const total = f.filas.reduce((s, x) => s + x.n, 0);
    igual(f.grupos.reduce((s, g) => s + g.n, 0), total);
    f.grupos.forEach(g => cierto(g.acierto_color > 0 && g.acierto_color <= 1));
  });

  prueba('fiabilidad: el grupo 8+ coincide con la fila 8+ del modelo', () => {
    const f = L.fiabilidad(D, principal.zona_mitma_id);
    const fila = f.filas.find(x => x.horizonte_txt === '8+');
    cierto(Math.abs(f.grupos[f.grupos.length - 1].acierto_color - fila.acierto_color) < 1e-9);
  });

  prueba('CSV: separador «;», decimales con coma y comillas escapadas', () => {
    igual(L.aCSV([['a', 1.5, null], ['x;y', 'di"ce']]), 'a;1,5;\r\n"x;y";"di""ce"');
  });

  prueba('CSV de previsión: una línea por fila + cabecera, con aviso si es sintético', () => {
    const f = L.alertasProximas(D, { dias: 7 });
    const csv = L.csvPrevision(f, true).split('\r\n');
    igual(csv.length, f.length + 1);
    cierto(csv[0].endsWith(';aviso')); cierto(csv[1].includes('SINTÉTICOS'));
    igual(L.csvPrevision(f, false).split('\r\n')[0].includes('aviso'), false);
  });

  /* ---------- Previsión de saturación ---------- */

  prueba('saturación: con el umbral rojo cuadra con los días rojos de 2027 previstos (año completo)', () => {
    const r = L.previsionSaturacion(D, { desde: '2027-01-01', hasta: '2027-12-31', umbral: D.regulacion.umbrales.rojo });
    D.regulacion.por_zona.forEach(z => {
      const a = z.anios.find(x => x.anio === 2027);
      igual(r.find(x => x.zona_mitma_id === z.zona_mitma_id).dias.length, a.dias_rojos, z.zona_mitma_id);
    });
  });

  prueba('saturación: solo días previstos (desde hoy), ordenados y por encima del umbral', () => {
    const u = 1.8;
    L.previsionSaturacion(D, { umbral: u }).forEach(z => {
      z.dias.forEach((d, i) => {
        cierto(d.fecha >= D.predicciones.fecha_hoy, 'pasado ' + d.fecha);
        cierto(d.cociente >= u - 1e-9, d.fecha + ' ' + d.cociente);
        if (i) cierto(z.dias[i - 1].fecha < d.fecha, 'orden');
      });
      igual(z.rachas.reduce((s, r) => s + r.dias, 0), z.dias.length, 'rachas');
      if (z.dias.length) igual(z.pico.cociente, Math.max(...z.dias.map(d => d.cociente)));
    });
  });

  prueba('saturación: con las filas ya calculadas da lo mismo que sin ellas', () => {
    const desde = D.predicciones.fecha_hoy, hasta = L.sumarDias(desde, 90);
    const filas = L.alertasProximas(D, { desde, dias: L.diasEntreISO(desde, hasta) + 1 });
    L.umbralesDisponibles(D).forEach(u => igual(JSON.stringify(L.previsionSaturacion(D, { desde, hasta, umbral: u, filas })),
      JSON.stringify(L.previsionSaturacion(D, { desde, hasta, umbral: u })), 'umbral ' + u));
  });

  prueba('saturación: subir el umbral nunca aumenta los días', () => {
    let previo = null;
    L.umbralesDisponibles(D).forEach(u => {
      const n = L.previsionSaturacion(D, { umbral: u }).map(z => z.dias.length);
      if (previo) n.forEach((x, i) => cierto(x <= previo[i], u + ' zona ' + i));
      previo = n;
    });
  });

  prueba('saturación: más allá del modelo de largo plazo se marca como «solo calendario»', () => {
    const r = L.previsionSaturacion(D, { umbral: 1.2 });
    const dias = [].concat(...r.map(z => z.dias));
    cierto(dias.some(d => d.lejana) && dias.some(d => !d.lejana));
    dias.forEach(d => igual(d.lejana, d.horizonte == null, d.fecha));
  });

  prueba('rachas: agrupa días seguidos, también entre meses', () => {
    const r = L.rachas(['2026-11-30', '2026-12-01', '2026-12-02', '2026-12-05']);
    igual(r.length, 2); igual(r[0].dias, 3); igual(r[0].hasta, '2026-12-02'); igual(r[1].desde, '2026-12-05');
  });

  prueba('concejos: concejosDeZona y zonasDeConcejo siguen el mapeo', () => {
    D.mapeo.zonas.forEach(z => z.concejos_ine.forEach(i => cierto(L.zonasDeConcejo(D, i).includes(z.zona_mitma_id))));
    igual(L.concejosDeZona(D, 'no-existe').length, 0);
  });

  prueba('buscar: sin tildes ni mayúsculas, primero lo que empieza por el texto', () => {
    const ind = [{ nombre: 'Villaviciosa' }, { nombre: 'Llanes' }, { nombre: 'Cangas de Onís' }, { nombre: 'Llanera' }];
    igual(L.buscar(ind, 'onis')[0].nombre, 'Cangas de Onís');
    igual(L.buscar(ind, 'LLAN').map(x => x.nombre).join(','), 'Llanera,Llanes');
    igual(L.buscar(ind, 'zzz').length, 0);
  });

  prueba('CSV de saturación: una línea por día con saturación + cabecera', () => {
    const r = L.previsionSaturacion(D, { umbral: 2 });
    igual(L.csvSaturacion(r, 2, false).split('\r\n').length, r.reduce((s, z) => s + z.dias.length, 0) + 1);
  });

  const resumen = document.createElement('h2');
  resumen.id = 'resumen';
  resumen.textContent = fallos ? 'FALLOS: ' + fallos + ' de ' + total : 'TODO OK: ' + total + ' pruebas';
  res.before(resumen);
  document.title = resumen.textContent;
})();
</script>
</body></html>
