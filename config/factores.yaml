# Agrupación de variables del modelo en factores legibles para la web.
# Orden importante: cada variable va al PRIMER factor cuyo patrón (regex) encaja.
# Efecto de un factor = exp(suma de SHAP de sus variables) - 1, en % sobre la
# predicción media del modelo (SHAP en escala log del cociente).
# mostrar: false -> no entra en los 3 factores principales de la web.
factores:
  - nombre: "Vacaciones escolares"
    patron: "^cal_vacaciones_"
  - nombre: "Festivo en origen (Madrid o Castilla y León)"
    patron: "^cal_.*_(mad|cyl)$"
  - nombre: "Puente o festivo en Asturias"
    patron: "^cal_(festivo|puente|finde_largo|vispera|dias_hasta|dias_desde|semana_santa)"
  - nombre: "Fin de semana"
    patron: "^cal_(dia_semana|fin_de_semana)$"
  - nombre: "Época del año"
    patron: "^cal_(mes|doy_sin|doy_cos)$"
  - nombre: "Acceso regulado a los Lagos"
    patron: "^cal_lagos_regulado$"
  - nombre: "Evento"
    patron: "^ev_"
  - nombre: "Partido"
    patron: "^futbol_"
  - nombre: "Tiempo en el valle"
    patron: "^tv_"
  - nombre: "Tiempo en la montaña"
    patron: "^tm_"
  - nombre: "Interés en internet"
    patron: "^int_"
  - nombre: "Zona"
    patron: "^zona$"
    mostrar: false
  - nombre: "Antelación"
    patron: "^horizonte$"
    mostrar: false
